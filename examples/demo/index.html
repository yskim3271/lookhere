<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Notes — demo page for lookhere</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d2330; background: #f7f8fa; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; background: #fff; border-bottom: 1px solid #e3e6eb; }
  .logo { font-weight: 800; font-size: 20px; }
  nav a { margin-left: 20px; color: #4a5263; text-decoration: none; }
  .signup { margin-left: 24px; padding: 4px 10px; font-size: 12px; background: #3b5bdb; color: #fff; border: 0; border-radius: 4px; }
  .hero { padding: 64px 40px; max-width: 720px; }
  .hero h1 { font-size: 40px; margin: 0 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px 40px; }
  .card { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 20px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
</style>
</head>
<body>
  <header>
    <div class="logo">Acme Notes</div>
    <nav><a href="#">Features</a><a href="#">Pricing</a><a href="#">Docs</a><button class="signup" data-testid="signup">Sign up</button></nav>
  </header>
  <section class="hero">
    <h1>Notes that keep up with you</h1>
    <p>Write, link, and find anything in seconds.</p>
  </section>
  <section class="cards">
    <article class="card"><h2>Fast search</h2><p>Find any note instantly.</p></article>
    <article class="card"><h2>Backlinks</h2><p>See how ideas connect.</p></article>
    <article class="card"><h2>Offline</h2><p>Works on a plane.</p></article>
  </section>
</body>
</html>
